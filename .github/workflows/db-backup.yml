name: db-backup

# Backup diário do schema core: pg_dump como crm_backup (somente leitura, sem BYPASSRLS, política de leitura nomeada),
# criptografado com age (chave PÚBLICA) e publicado como artefato privado por 30 dias. A lógica fica em
# database/scripts/backup.sh, a mesma exercitada pelos testes 26 a 28 do harness.
# Roda no ambiente `backup`, SEM revisor (um job agendado não pode esperar aprovação), com um único trio de segredos:
# a URI e a senha do crm_backup e a chave pública do age. A chave privada nunca está aqui (ambiente `restore-test`).
on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: db-backup
  cancel-in-progress: false

env:
  # Versão major do pg_dump: precisa ser >= a do servidor Supabase (o backup.sh confere e falha com mensagem clara) e igual à
  # do PostgreSQL do db-restore-check.yml (dump de versão mais nova não é lido por pg_restore mais antigo).
  PG_MAJOR: "16"

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: backup
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          persist-credentials: false

      - name: Instalar o cliente PostgreSQL ${{ env.PG_MAJOR }} e o age
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -q --no-install-recommends "postgresql-client-${PG_MAJOR}" age
          echo "/usr/lib/postgresql/${PG_MAJOR}/bin" >> "$GITHUB_PATH"

      - name: Gerar o backup criptografado
        id: backup
        env:
          BACKUP_URL: ${{ secrets.SUPABASE_BACKUP_URL }}
          PGPASSWORD: ${{ secrets.SUPABASE_BACKUP_PASSWORD }}
          BACKUP_AGE_PUBLIC_KEY: ${{ secrets.BACKUP_AGE_PUBLIC_KEY }}
        run: |
          set +x
          for v in BACKUP_URL PGPASSWORD BACKUP_AGE_PUBLIC_KEY; do
            if [ -z "${!v}" ]; then echo "::error::secret ausente: $v"; exit 1; fi
          done
          echo "::add-mask::$PGPASSWORD"
          # a URI precisa ser do papel crm_backup (ou crm_backup.<ref> no Supavisor) e exigir TLS; falha antes de qualquer arquivo
          bash database/scripts/pg_uri_to_flyway_env.sh "$BACKUP_URL" crm_backup > /dev/null
          export OUT_DIR="$RUNNER_TEMP/backup"
          mkdir -p "$OUT_DIR"
          bash database/scripts/backup.sh

      - name: Publicar o artefato (privado, 30 dias)
        uses: actions/upload-artifact@v4.6.2
        with:
          name: ${{ steps.backup.outputs.backup_name }}
          path: ${{ steps.backup.outputs.backup_file }}
          retention-days: 30
          if-no-files-found: error
          compression-level: 0 # já está criptografado; comprimir não ajuda

      - name: Remover arquivos temporários
        if: always()
        run: rm -rf "$RUNNER_TEMP/backup"
