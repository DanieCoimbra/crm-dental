name: backend-ci

# Teste 25 do banco: o `ddl-auto=validate` do backend passa contra o schema REAL. Os testes de integração sobem um
# PostgreSQL 16 (Testcontainers), aplicam database/bootstrap + database/migrations (os mesmos scripts do banco, via
# back-java/docker/db-init.sh) e a aplicação conecta como crm_app. Também roda toda a suíte do backend.
# Sem segredos: senhas e chaves dos testes são geradas em memória a cada execução.
on:
  pull_request:
    paths:
      - "back-java/**"
      - "database/**"
      - ".github/workflows/backend-ci.yml"
  push:
    branches: [main]
    paths:
      - "back-java/**"
      - "database/**"

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-verify:
    name: backend-verify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: back-java
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-java@v4.7.1
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: back-java/pom.xml

      - name: mvn verify (testes unitários, web e de integração com PostgreSQL real)
        # `bash mvnw` não depende do bit de execução, que o Git pode perder ao commitar no Windows
        run: bash mvnw -B verify
