name: db-pr

# Valida o banco antes do merge: PostgreSQL 16 descartável, bootstrap, `flyway migrate`, `flyway validate`, todos os
# testes SQL e a cadeia de rollback. Sem acesso a produção e sem segredos: a senha do banco de teste é gerada na hora.
#
# Roda em TODO pull request (sem filtro `paths`): o check `db-validate` é obrigatório na proteção da `main`, e um check
# obrigatório que nunca é disparado deixaria "Expected — waiting for status" e travaria PRs que não tocam o banco.
# O próprio job decide: sem mudanças em database/** (nem neste workflow), termina verde em segundos.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: db-pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # O nome do job é o check obrigatório da proteção da branch `main`.
  db-validate:
    name: db-validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detectar mudanças no banco
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if git diff --name-only "$BASE_SHA" "$HEAD_SHA" | grep -Eq '^(database/|\.github/workflows/db-pr\.yml$)'; then
            echo "database=true" >> "$GITHUB_OUTPUT"
            echo "O PR altera o banco: rodando o harness completo."
          else
            echo "database=false" >> "$GITHUB_OUTPUT"
            echo "O PR não altera database/** nem este workflow: nada a validar (check verde)."
          fi

      - name: Testes do banco (bootstrap, Flyway, testes SQL e rollback)
        if: steps.changes.outputs.database == 'true'
        run: |
          # Mesmo harness do desenvolvimento local: imagem database/tests/Dockerfile (psql + openssl + Flyway)
          POSTGRES_PASSWORD="$(openssl rand -hex 24)"
          echo "::add-mask::$POSTGRES_PASSWORD"
          export POSTGRES_PASSWORD
          docker compose -f database/docker-compose.yml --profile test run --rm --build tests

      - name: Limpar contêineres
        if: always() && steps.changes.outputs.database == 'true'
        run: |
          POSTGRES_PASSWORD=descartavel docker compose -f database/docker-compose.yml --profile test down -v --remove-orphans
