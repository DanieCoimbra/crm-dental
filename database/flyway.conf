# Flyway Community 11 — configuração SEM credenciais.
# URL, usuário e senha vêm do ambiente (FLYWAY_URL, FLYWAY_USER, FLYWAY_PASSWORD); nunca por argumento nem arquivo.
# Os caminhos são relativos à raiz do repositório (database/scripts/flyway.sh define o diretório de trabalho).

flyway.locations=filesystem:database/migrations

# Tudo vive no schema core; o histórico fica em core.flyway_schema_history (dono crm_owner, sem GRANT ao crm_app).
flyway.defaultSchema=core
flyway.schemas=core
flyway.table=flyway_schema_history

# Migrations aplicadas são imutáveis: checksum alterado faz o validate falhar; nada de clean nem fora de ordem.
flyway.cleanDisabled=true
flyway.outOfOrder=false
flyway.validateMigrationNaming=true
flyway.baselineOnMigrate=false

# O SQL das migrations não usa placeholders; não interpretar "${...}" evita surpresas.
flyway.placeholderReplacement=false

flyway.connectRetries=3
