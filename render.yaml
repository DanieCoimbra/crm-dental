services:
  - type: web
    name: dental-crm-api
    env: go
    rootDir: backend-go
    buildCommand: go build -o server cmd/server/main.go
    startCommand: ./server
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 8080
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: APP_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
