# Configuração base. Segredos e endereços vêm só de variáveis de ambiente (ver .env.example).
spring:
  application:
    name: crm-api
  autoconfigure:
    # Autenticação própria (JWT, F04): sem usuário padrão gerado pelo Spring Security.
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  datasource:
    url: ${DB_URL}
    username: ${DB_APP_USER}
    password: ${DB_APP_PASSWORD}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 5000
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
      resolve-lazily: true # o limite de uploads por minuto roda antes da leitura do corpo
      file-size-threshold: 256KB
  jpa:
    show-sql: false
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: core
        jdbc:
          time_zone: UTC
        type:
          # LocalDate/LocalTime/LocalDateTime vão direto ao driver (setObject/getObject). Sem isto, o jdbc.time_zone acima
          # desloca o horário pelo fuso da JVM (08:00 virava 11:00 no banco, e 24:00 era lido como 21:00).
          java_time_use_direct_jdbc: true

server:
  port: ${PORT:8080}
  forward-headers-strategy: native
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false
  shutdown: graceful
  tomcat:
    max-swallow-size: 12MB # evita connection reset em vez de 413 quando o corpo excede o limite
    accesslog:
      enabled: false # a URL pode levar CPF na busca de pacientes

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        readiness:
          include: readinessState,db

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  level:
    # nem o SQL nem os valores ligados aos parâmetros (CPF, nome) podem ir para o log
    org.hibernate.SQL: warn
    org.hibernate.orm.jdbc.bind: warn
  pattern:
    level: "%5p [%X{requestId:-}]"

crm:
  cors-origins: ${CRM_CORS_ORIGINS:}
  storage:
    url: ${CRM_STORAGE_URL:}
    service-key: ${CRM_STORAGE_SERVICE_KEY:}
    bucket: ${CRM_STORAGE_BUCKET:}
    signed-url-ttl: 60s
    local-dir: ${CRM_STORAGE_LOCAL_DIR:} # só dev/teste (url vazia); vazio = diretório temporário
  hsts-enabled: false
  jwt:
    # sem valor padrão: a aplicação não sobe sem segredo de pelo menos 32 bytes (shared/config/JwtConfig)
    secret: ${CRM_JWT_SECRET:}
  auth:
    bcrypt-strength: 12
    registrations-per-hour: 60 # teto global de clínicas novas por hora (qualquer IP)
  crypto:
    # sem valores padrão: a aplicação não sobe sem chaveiro válido (shared/crypto/CryptoConfig)
    keys: ${CRM_AES_KEYS:}
    active-version: ${CRM_AES_ACTIVE_VERSION:}
